name: CI - Pipeline de Churn

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  run-pipeline:
    runs-on: ubuntu-latest
    
    steps:
      # 1. Obtener el código del repositorio
      - name: 1. Checkout del repositorio
        uses: actions/checkout@v4

      # 2. Configurar el entorno de Python
      - name: 2. Set up Python
        uses: actions/setup-python@v4
        with:
          # Versión actualizada para coincidir con tu entorno local
          python-version: 3.10 

      # 3. Instalar las dependencias
      - name: 3. Instalar dependencias
        run: |
          pip install -r requirements.txt
          
      # 4. Configurar las credenciales de DagsHub
      - name: 4. Configurar DagsHub
        uses: DagsHub/setup-dagshub@v0
        with:
          repo_owner: 'mauricio.kemerer'
          repo_name: 'ProyectoTelco'
          
      # 5. Descargar los datos y modelos versionados
      - name: 5. DVC Pull
        run: dvc pull

      # 6. Ejecutar el pipeline completo
      - name: 6. DVC Reproduce
        run: dvc repro

      # 7. Mostrar las métricas en el log
      - name: 7. Mostrar Métricas
        run: |
          echo "✅ Pipeline ejecutado. Métricas resultantes:"
          cat metrics.json
