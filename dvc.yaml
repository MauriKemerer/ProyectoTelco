stages:
  data_prep:
    cmd: python src/data_prep.py
    deps:
      - data/raw/telco_churn.csv
      - src/data_prep.py
    outs:
      - data/processed/telco_churn_clean.csv

  train:
    cmd: python src/train.py
    deps:
      - data/processed/telco_churn_clean.csv
      - src/train.py  # La dependencia del script se queda aquí
    params:
      # 🎯 Aquí especificamos los parámetros a rastrear
      - train.test_size
      - train.random_state
      - train.solver
      - train.max_iter
      - train.C
    outs:
      - models/model.pkl
    metrics:
      # Usamos la sintaxis estándar para métricas
      - metrics/metrics.json:
          cache: false
